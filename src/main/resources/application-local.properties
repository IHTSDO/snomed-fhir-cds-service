# Local profile CORS settings for frontend development.
app.cors.enabled=true
app.cors.allowed-origin-patterns=*
app.cors.allowed-methods=GET,POST,OPTIONS
app.cors.allowed-headers=*
# Lets a frontend deployed on a public site call this service on localhost (Private Network Access, Chromium).
app.cors.allow-private-network=true

# To debug diagnostic rule evaluation (what the service receives, and suppression decisions),
# uncomment the next line. Off by default.
# logging.level.org.snomed.cdsservice.service.rules=DEBUG
